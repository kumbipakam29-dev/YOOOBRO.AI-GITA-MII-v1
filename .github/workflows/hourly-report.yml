name: MIi Hourly Status Report
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/hourly-report.yml'
      - 'src/miilab/**'
      - 'tests/**'
      - 'datasets/**'
permissions:
  actions: read
  contents: write
concurrency:
  group: miilab-hourly-report-${{ github.ref }}
  cancel-in-progress: true
jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run regression tests
        id: tests
        continue-on-error: true
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Run simulation-to-reality gate on actual runner
        id: reality
        continue-on-error: true
        env:
          PYTHONPATH: src
        run: |
          python -m miilab.reality_gate --output evidence/reality_gate_latest.json --markdown-output reports/reality/reality_gate_latest.md
      - name: Record hourly status snapshot
        env:
          TEST_OUTCOME: ${{ steps.tests.outcome }}
          REALITY_OUTCOME: ${{ steps.reality.outcome }}
        run: |
          mkdir -p reports/hourly
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          gate_path = Path("evidence/reality_gate_latest.json")
          gate = json.loads(gate_path.read_text(encoding="utf-8")) if gate_path.exists() else None
          summary = gate.get("summary", {}) if gate else {}
          tasks = gate.get("real_task_results", {}) if gate else {}
          report = {
            "schema_version": "miilab.hourly-report.v2",
            "generated_at": datetime.now(timezone.utc).isoformat(),
            "repository": os.getenv("GITHUB_REPOSITORY"),
            "commit_sha": os.getenv("GITHUB_SHA"),
            "workflow_run_id": os.getenv("GITHUB_RUN_ID"),
            "report_type": "BEST_EFFORT_HOURLY_STATUS_AND_REALITY_GATE",
            "test_step_outcome": os.getenv("TEST_OUTCOME"),
            "reality_gate_step_outcome": os.getenv("REALITY_OUTCOME"),
            "reality_gate_summary": summary,
            "actual_runner_task_statuses": {k: v.get("status") for k, v in tasks.items()},
            "model_training_claim": "No large foundation model is trained by this status workflow.",
            "virtual_compute": "SIMULATION_ONLY; the runner capability probe is separate evidence.",
            "pending": [
              "Frontier tasks require separate authorized benchmark runs",
              "No MIi generative LLM weights are claimed by this workflow",
              "Device and production capability still require separate tests"
            ]
          }
          Path("reports/hourly/latest.json").write_text(json.dumps(report, ensure_ascii=False, indent=2)+"\n", encoding="utf-8")
          lines = [
            "# MIi Hourly Status Snapshot", "",
            f"- Generated UTC: {report['generated_at']}",
            f"- Repository: {report['repository']}",
            f"- Source commit: {report['commit_sha']}",
            f"- Regression tests: {report['test_step_outcome']}",
            f"- Simulation-to-reality gate: {report['reality_gate_step_outcome']}",
            f"- Comparison rows: {summary.get('comparison_rows', 'no report')}",
            f"- Matches: {summary.get('matching_comparisons', 'no report')}",
            f"- Simulation/reality gaps including resource-guard blocks: {summary.get('simulation_reality_gaps_or_failures_including_guard_blocks', summary.get('simulation_reality_gaps_or_failures', 'no report'))}",
            f"- Simulated-success tasks blocked by the real runner: {summary.get('simulated_success_blocked_in_real_runner', 0)}",
            f"- Large-model fine-tuning claimed: {summary.get('large_model_training_claimed', False)}",
            "", "## Actual runner task statuses", ""
          ]
          lines += [f"- {name}: {value.get('status')}" for name, value in tasks.items()]
          lines += ["", "Virtual CPU/GPU/TPU/server/infinity profiles are simulations, not provisioned resources.",
                    "This is best-effort; GitHub may delay scheduled runs. A hosted-runner pass does not prove Android-device or production success.", ""]
          Path("reports/hourly/latest.md").write_text("\n".join(lines), encoding="utf-8")
          PY
      - name: Commit hourly report and evidence if changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/hourly/latest.json reports/hourly/latest.md
          if [ -f evidence/reality_gate_latest.json ]; then git add evidence/reality_gate_latest.json; fi
          if [ -f reports/reality/reality_gate_latest.md ]; then git add reports/reality/reality_gate_latest.md; fi
          if git diff --cached --quiet; then
            echo 'No report change.'
          else
            git commit -m 'chore: refresh hourly simulation-reality report'
            branch="${GITHUB_REF_NAME}"
            pushed=false
            for attempt in 1 2 3; do
              git fetch origin "${branch}"
              if ! git rebase "origin/${branch}"; then
                git rebase --abort || true
                sleep $((attempt * 2))
                continue
              fi
              if git push origin "HEAD:${branch}"; then
                pushed=true
                break
              fi
              sleep $((attempt * 2))
            done
            if [ "${pushed}" != true ]; then
              echo "Failed to push hourly report after retries." >&2
              exit 1
            fi
          fi
      - name: Mark report run failed if its checks failed
        if: steps.tests.outcome == 'failure' || steps.reality.outcome == 'failure'
        run: exit 1
